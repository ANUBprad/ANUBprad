<svg width="1000" height="24" viewBox="0 0 1000 24" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>.dot{animation:run 4s ease-in-out infinite alternate}.glow{animation:g 2s ease-in-out infinite}@keyframes run{from{transform:translateX(0)}to{transform:translateX(900px)}}@keyframes g{50%{opacity:.35}}</style>
<defs><linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#30363d" stop-opacity="0"/><stop offset=".5" stop-color="#58a6ff" stop-opacity=".55"/><stop offset="1" stop-color="#30363d" stop-opacity="0"/></linearGradient></defs>
<rect x="50" y="11" width="900" height="2" rx="1" fill="url(#l)"/>
<g class="dot"><circle cx="50" cy="12" r="6" fill="#58a6ff" opacity=".25" class="glow"/><circle cx="50" cy="12" r="2.5" fill="#58a6ff"/></g>
</svg>