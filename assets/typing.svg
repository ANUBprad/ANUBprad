<svg xmlns="http://www.w3.org/2000/svg" width="900" height="104" viewBox="0 0 900 104" role="img" aria-labelledby="title desc">
<title id="title">Animated terminal workflow</title>
<desc id="desc">Terminal output cycles through build, measure, debug and improve messages.</desc>
<rect x="1" y="1" width="898" height="102" rx="8" fill="#0d1117" stroke="#30363d"/>
<text x="18" y="22" fill="#8b949e" font-family="monospace" font-size="11">LIVE SESSION — workflow.sh</text>
<g font-family="monospace" font-size="16">
<text x="20" y="49" fill="#7ee787">$</text>
<text x="42" y="49" fill="#c9d1d9">build LLM and agent systems</text>
<text x="42" y="49" fill="#c9d1d9" opacity="0">measure what matters<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.24;0.28;0.48;0.52" dur="8s" repeatCount="indefinite"/></text>
<text x="42" y="49" fill="#c9d1d9" opacity="0">debug the failure path<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.49;0.53;0.73;0.77" dur="8s" repeatCount="indefinite"/></text>
<text x="42" y="49" fill="#c9d1d9" opacity="0">ship. observe. improve.<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.74;0.78;0.98;1" dur="8s" repeatCount="indefinite"/></text>
</g>
<rect x="335" y="33" width="8" height="19" fill="#7ee787"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
<path d="M20 68 H880" stroke="#30363d"/>
<text x="20" y="88" fill="#8b949e" font-family="monospace" font-size="12">process status: <tspan fill="#7ee787">running</tspan><tspan> · no shortcuts, just iterations</tspan></text>
</svg>