<svg xmlns="http://www.w3.org/2000/svg" width="900" height="205" viewBox="0 0 900 205" role="img" aria-labelledby="title desc">
<title id="title">Anubhab Pradhan terminal</title>
<desc id="desc">A terminal window animates through startup commands to introduce Anubhab Pradhan.</desc>
<rect x="1" y="1" width="898" height="203" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M1 38 H899" stroke="#30363d"/>
<circle cx="22" cy="20" r="5" fill="#ff5f56"/><circle cx="40" cy="20" r="5" fill="#ffbd2e"/><circle cx="58" cy="20" r="5" fill="#27c93f"/>
<text x="78" y="24" fill="#8b949e" font-family="monospace" font-size="12">anubhab@github: ~/profile</text>
<g font-family="monospace" font-size="15">
<text x="24" y="64" fill="#7ee787">$ ./init --profile</text>
<text x="24" y="91" fill="#8b949e" opacity="0">[ OK ] loading user profile<animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.18;0.22;1" dur="6s" repeatCount="indefinite"/></text>
<text x="24" y="121" fill="#7ee787" font-size="26" font-weight="bold" opacity="0">Anubhab Pradhan<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.36;1" dur="6s" repeatCount="indefinite"/></text>
<text x="24" y="148" fill="#c9d1d9" opacity="0">AI / ML · LLM systems · Computer Vision<animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.4;0.48;0.55;1" dur="6s" repeatCount="indefinite"/></text>
<text x="24" y="177" fill="#8b949e" font-size="12">STATUS: exploring, building, evaluating, improving</text>
</g>
<rect x="24" y="188" width="8" height="2" fill="#7ee787"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</svg>